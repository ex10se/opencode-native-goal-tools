name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: ['22.19.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate
      - run: npm pack --dry-run
      - name: Install isolated smoke host
        run: npm install --prefix "$RUNNER_TEMP/goal-host" @opencode/cli@2.3.0
      - name: Packed package and native Goal lifecycle smoke
        run: npm run test:package -- "$RUNNER_TEMP/goal-host/node_modules/.bin/opencode"
